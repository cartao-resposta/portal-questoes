  :root{
    box-sizing:border-box;

    --bg:#f3f1ec; --surface:#ffffff; --linha:#e5e1d8; --texto:#1e2733; --suave:#66707d;

    --sombra-lg:0 14px 38px rgba(23,37,57,.16);

    @media (prefers-color-scheme: dark){
      --bg:#11151b; --surface:#1a2029; --linha:#2b333e; --texto:#e8ecf1; --suave:#98a3b1;

      --ok-bg:#12311f; --erro-bg:#381616; --alerta-bg:#2a2113; --chip:#232b36; --sel-bg:#3a2a12;

      --sombra-lg:0 14px 38px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11151b; --surface:#1a2029; --linha:#2b333e; --texto:#e8ecf1; --suave:#98a3b1;

function calcNota(respArray){

  respArray.forEach(r=>{ max+=(r.pontos||0); if(r.obtidos==null){ if(r.tipo==="dissertativa") pend=true; } else got+=r.obtidos; });

function altsPreview(q){

// ---- enunciado com imagem na posição escolhida (antes/meio/depois) ----
const enunHTML = t => esc(t).replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");
function partirMeio(texto){
  const paras=texto.split(/\n{2,}/);
  if(paras.length>1){ const m=Math.ceil(paras.length/2); return [paras.slice(0,m).join("\n\n"), paras.slice(m).join("\n\n")]; }
  const alvo=Math.floor(texto.length/2);
  const pts=[...texto.matchAll(/[.!?]\s+/g)].map(m=>m.index+m[0].length);
  if(!pts.length) return [texto,""];
  let best=pts[0]; for(const pp of pts) if(Math.abs(pp-alvo)<Math.abs(best-alvo)) best=pp;
  return [texto.slice(0,best).trim(), texto.slice(best).trim()];
}
function enunciadoComImagem(q){
  if(!q.imagem) return `<div class="enun">${enunHTML(q.enunciado)}</div>`;
  const img=`<img class="qimg" src="${q.imagem}" alt="imagem da questão">`;
  const pos=q.imagemPos||"antes";
  if(pos==="antes")  return img+`<div class="enun">${enunHTML(q.enunciado)}</div>`;
  if(pos==="depois") return `<div class="enun">${enunHTML(q.enunciado)}</div>`+img;
  const [a,b]=partirMeio(q.enunciado);
  return `<div class="enun">${enunHTML(a)}</div>`+img+(b?`<div class="enun" style="margin-top:8px">${enunHTML(b)}</div>`:"");
}
function lerImagemRedimensionada(file, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const maxL=1200; let w=img.width, h=img.height;
      if(w>maxL){ h=Math.round(h*maxL/w); w=maxL; }
      try{ const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h); cb(c.toDataURL("image/jpeg",0.85)); }
      catch(err){ cb(e.target.result); }
    };
    img.onerror=()=>cb(e.target.result);
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function carregarTudo(){
  if(!sb) return;
  const [q,tu,te,re] = await Promise.all([
    sb.from('questoes').select('*').order('criado_em'),
    sb.from('turmas').select('*').order('criado_em'),
    sb.from('testes').select('*').order('criado_em'),
    sb.from('respostas').select('*').order('criado_em'),
  ]);
  if(q.error||tu.error||te.error||re.error) throw (q.error||tu.error||te.error||re.error);
  state.questoes = (q.data||[]).map(qFromDB);
  state.turmas   = (tu.data||[]).map(turmaFromDB);
  state.testes   = (te.data||[]).map(testeFromDB);
  state.respostas= (re.data||[]).map(respFromDB);
  marcarSincronizado();
}

// ---- sincronização por diferença: envia só o que mudou ----
let snap = {questoes:{}, turmas:{}, testes:{}, respostas:{}};
function chaveDe(col, o){ return JSON.stringify(col==='questoes'?qToDB(o):col==='turmas'?turmaToDB(o):col==='testes'?testeToDB(o):respToDB(o)); }
function marcarSincronizado(){
  snap = {questoes:{}, turmas:{}, testes:{}, respostas:{}};
  ['questoes','turmas','testes','respostas'].forEach(c=> state[c].forEach(o=> snap[c][o.id]=chaveDe(c,o)) );
}
let syncT=null, sincronizando=false;
function agendarSync(){ if(!sb||!profLiberado) return; clearTimeout(syncT); syncT=setTimeout(sincronizar, 700); }
async function sincronizar(){
  if(!sb||!profLiberado||sincronizando) return;
  sincronizando=true;
  try{
    for(const [nome, arr, toDB] of [['questoes',state.questoes,qToDB],['turmas',state.turmas,turmaToDB],['testes',state.testes,testeToDB],['respostas',state.respostas,respToDB]]){
      const atuais={}, upserts=[];
      for(const o of arr){ const k=chaveDe(nome,o); atuais[o.id]=k; if(snap[nome][o.id]!==k) upserts.push(toDB(o)); }
      const removidos=Object.keys(snap[nome]).filter(id=>!(id in atuais));
      if(upserts.length){ const {error}=await sb.from(nome).upsert(upserts); if(error) throw error; }
      if(removidos.length){ const {error}=await sb.from(nome).delete().in('id', removidos); if(error) throw error; }
      snap[nome]=atuais;
    }
  }catch(e){ toast("Falha ao salvar no servidor: "+(e.message||"verifique a conexão")); }
  finally{ sincronizando=false; }
}
async function recarregarResultados(){
  if(!sb){ render(); return; }
  const {data,error}=await sb.from('respostas').select('*').order('criado_em');
  if(error){ toast("Não consegui atualizar os resultados."); return; }
  state.respostas=(data||[]).map(respFromDB);
  state.respostas.forEach(o=> snap.respostas[o.id]=chaveDe('respostas',o));
  render(); toast("Resultados atualizados.");
}

function turmaNome(id){ return (state.turmas.find(t=>t.id===id)||{}).nome || "—"; }
function respTurmaId(r){ return r.turmaId || (turmaDoAluno(r.alunoId)||{}).id || null; }
function toDateInput(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function fmtData(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}/${p(d.getMonth()+1)}`; }

// ================= render =================
function render(){
  if(CONECTADO) agendarSync(); else salvarLocal();
  // trava da área do professor
  if(papel==="prof" && !profLiberado){
    pararCronometro();
    document.getElementById("app").innerHTML=telaBloqueioProf();
    const i=document.getElementById("loginEmail"); if(i) i.focus();
    return;
  }
  if(previa){ pararCronometro(); document.getElementById("app").innerHTML=telaPrevia(); medirTopo(); return; }
  document.getElementById("app").innerHTML = papel==="prof"? viewProf() : viewAluno();
  aplicarFonteAluno();
  medirTopo();
  if(papel==="prof" && aba==="montar") ligarMontagem();
  if(papel==="prof" && aba==="cadastro") ligarCadastro();
  if(papel==="prof" && aba==="importpdf") ligarImportPDF();
  if(papel==="aluno" && sessaoAluno && !sessaoAluno.enviado && sessaoAluno.prazo) iniciarCronometro();
  else pararCronometro(); }

function viewProf(){
  const abas = `<div class="abas" style="align-items:center">
    ${aba==="banco"||aba==="cadastro"||aba==="importpdf"?abaOn("banco","Banco de questões"):abaOff("banco","Banco de questões")}
    ${aba==="provas"||aba==="montar"?abaOn("provas","Provas"):abaOff("provas","Provas")}
    ${aba==="turmas"?abaOn("turmas","Turmas"):abaOff("turmas","Turmas")}
    ${aba==="result"?abaOn("result","Resultados"):abaOff("result","Resultados")}
    ${CONECTADO?`<button style="margin-left:auto; border-color:var(--linha)" onclick="fazerLogout()" title="${esc(usuarioEmail||"")}">Sair</button>`:""}
  </div>`;
  let corpo="";
  if(aba==="banco") corpo=telaBanco();
  else if(aba==="cadastro") corpo=telaCadastro();
  else if(aba==="importpdf") corpo=telaImportPDF();
  else if(aba==="montar") corpo=telaMontar();
  else if(aba==="provas") corpo=telaProvas();
  else if(aba==="turmas") corpo=telaTurmas();
  else corpo=telaResultados();
  return abas+corpo;
}
const abaOn=(a,t)=>`<button class="on" onclick="setAba('${a}')">${t}</button>`;
const abaOff=(a,t)=>`<button onclick="setAba('${a}')">${t}</button>`;

let filtro={q:"",assunto:"",dif:"",serie:"",fonte:"",tipo:""};
function questoesFiltradas(){
  const termo=normNome(filtro.q||"");
  return state.questoes.filter(q=>
    (!filtro.assunto||q.assunto===filtro.assunto) &&
    (!filtro.dif||q.dificuldade===filtro.dif) &&
    (!filtro.serie||String(q.serie)===filtro.serie) &&
    (!filtro.fonte||(q.fonte||"")===filtro.fonte) &&
    (!filtro.tipo||tipoDe(q)===filtro.tipo) &&
    (!termo||normNome([q.enunciado,q.assunto,q.subassunto,(q.tags||[]).join(" "),q.fonte].filter(Boolean).join(" ")).includes(termo))
  );
}
function listaBancoHTML(){
  const qs=questoesFiltradas();
  return `<p class="sub" style="margin:12px 0 0">${qs.length} de ${state.questoes.length} questões</p>`
    + (qs.map(cardQ).join("")||'<p class="vazio">Nada com esses filtros.</p>');
}

function editarQuestao(id){ const q=state.questoes.find(x=>x.id===id); if(q){ novaQ=questaoParaForm(q); setAba("cadastro"); } }
function duplicarQuestao(id){
  const q=state.questoes.find(x=>x.id===id); if(!q) return;
  const copia=JSON.parse(JSON.stringify(q)); copia.id=nid(); copia.enunciado=(copia.enunciado||"")+" (cópia)";
  const i=state.questoes.findIndex(x=>x.id===id); state.questoes.splice(i+1,0,copia);
  salvarLocal(); atualizarBancoLista(); toast("Questão duplicada — edite a cópia se quiser.");
}
function excluirQuestao(id){
  const q=state.questoes.find(x=>x.id===id); if(!q) return;
  confirmar("Excluir esta questão do banco? Esta ação não pode ser desfeita.", ()=>{
    state.questoes=state.questoes.filter(x=>x.id!==id);
    state.testes.forEach(t=>{ t.questaoIds=t.questaoIds.filter(qid=>qid!==id); });
    render();
  });
}
function formVazio(){
  return { editId:null, tipo:"multipla_escolha", disciplina:"História", assunto:"", subassunto:"", tags:"", serie:"3", dificuldade:"media",
    fonte:"", ano:"", enunciado:"", resolucao:"", pontos:"1",
    alts:["A","B","C","D","E"].map(l=>({letra:l, texto:"", correta:false, imagem:null})),
    gabaritoVF:true, imagem:null, imagemPos:"antes" };
}
function questaoParaForm(q){
  const tipo=tipoDe(q); const base=formVazio();
  base.editId=q.id; base.tipo=tipo;
  base.disciplina=q.disciplina||"História"; base.assunto=q.assunto||""; base.serie=q.serie?String(q.serie):"";
  base.subassunto=q.subassunto||""; base.tags=(q.tags||[]).join(", ");
  base.dificuldade=q.dificuldade||"media"; base.fonte=q.fonte||""; base.ano=q.ano?String(q.ano):"";
  base.enunciado=q.enunciado||""; base.resolucao=q.resolucao||""; base.pontos=String(pontosDe(q));
  base.imagem=q.imagem||null; base.imagemPos=q.imagemPos||"antes";
  if(tipo==="vf") base.gabaritoVF=!!q.gabaritoVF;
  if(tipo==="multipla_escolha"){
    const letras=["A","B","C","D","E"];
    base.alts=letras.map((l,i)=>{ const a=(q.alternativas||[])[i]; return a?{letra:l,texto:a.texto||"",correta:!!a.correta,imagem:a.imagem||null}:{letra:l,texto:"",correta:false,imagem:null}; });
  }
  return base;
}

function trocarTipo(v){ novaQ.tipo=v; render(); }
function ligarCadastro(){
  const bind=(id,campo)=>{const el=document.getElementById(id); if(el) el.oninput=()=>novaQ[campo]=el.value;};
  bind("ncDisc","disciplina"); bind("ncAssunto","assunto"); bind("ncSub","subassunto"); bind("ncTags","tags"); bind("ncFonte","fonte");
  bind("ncAno","ano"); bind("ncEnun","enunciado"); bind("ncPontos","pontos"); bind("ncResol","resolucao");
  const s=document.getElementById("ncSerie"); if(s) s.onchange=()=>novaQ.serie=s.value;
  const d=document.getElementById("ncDif"); if(d) d.onchange=()=>novaQ.dificuldade=d.value;
  document.querySelectorAll(".ncAltTxt").forEach(inp=>{ inp.oninput=()=>{novaQ.alts[+inp.dataset.i].texto=inp.value;}; });
}
function marcarCorretaNova(i){ novaQ.alts.forEach((a,j)=>a.correta=(j===i)); }
function ncSetImg(url){ novaQ.imagem=url; if(!novaQ.imagemPos) novaQ.imagemPos="antes"; render(); }
function ncFileImg(input){ const f=input.files&&input.files[0]; if(f&&f.type.startsWith("image/")) lerImagemRedimensionada(f, ncSetImg); }
function ncDropImg(ev){ ev.preventDefault(); ev.currentTarget.classList.remove("sobre"); const f=[...(ev.dataTransfer.files||[])].find(x=>x.type.startsWith("image/")); if(f) lerImagemRedimensionada(f, ncSetImg); }
function addAltImg(i, input){ const f=input.files&&input.files[0]; if(f&&f.type.startsWith("image/")) lerImagemRedimensionada(f, url=>{ novaQ.alts[i].imagem=url; render(); }); }
function removerAltImg(i){ novaQ.alts[i].imagem=null; render(); }
function salvarQuestao(){
  const n=novaQ; const msg=t=>{const m=document.getElementById("ncMsg"); if(m) m.textContent=t;};
  if(!n.enunciado.trim()){ msg("Escreva o enunciado."); return; }
  const base={
    disciplina:n.disciplina.trim()||"História", assunto:n.assunto.trim()||"Sem assunto",
    subassunto:(n.subassunto||"").trim()||null,
    tags:(n.tags||"").split(",").map(s=>s.trim()).filter(Boolean),
    serie:n.serie?parseInt(n.serie,10):null, dificuldade:n.dificuldade,
    enunciado:n.enunciado.trim(), fonte:n.fonte.trim()||"autoral", ano:n.ano?parseInt(n.ano,10):null,
    resolucao:n.resolucao.trim()||null, pontos:n.pontos?parseFloat(n.pontos):1,
    imagem:n.imagem||null, imagemPos:n.imagem?(n.imagemPos||"antes"):null, tipo:n.tipo,
  };
  if(n.tipo==="multipla_escolha"){
    const alts=n.alts.filter(a=>a.texto.trim()||a.imagem);
    const correta=n.alts.find(a=>a.correta && (a.texto.trim()||a.imagem));
    if(alts.length<2){ msg("Preencha ao menos duas alternativas."); return; }
    if(!correta){ msg("Marque a alternativa correta."); return; }
    base.alternativas=alts.map(a=>({letra:a.letra, texto:a.texto.trim(), correta:!!a.correta, imagem:a.imagem||null}));
    base.gabaritoVF=null;
  } else if(n.tipo==="vf"){
    base.gabaritoVF=!!n.gabaritoVF; base.alternativas=null;
  } else {
    base.alternativas=null; base.gabaritoVF=null;
  }
  const final={ id:n.editId||nid(), ...base };
  if(n.editId){ const i=state.questoes.findIndex(x=>x.id===n.editId); if(i>=0) state.questoes[i]=final; }
  else state.questoes.push(final);
  novaQ=null; filtro={assunto:"",dif:""}; setAba("banco");
}

function telaImportPDF(){
  const i=impPDF, assuntos=[...new Set(state.questoes.map(q=>q.assunto))].sort();
  const temQ=i.questoes.length>0;
  const prontas=i.questoes.filter(q=>q.incluir&&q.flags.length===0).length;
  const rev=i.questoes.filter(q=>q.flags.length>0).length;
  const comGab=i.questoes.filter(q=>q.correta).length;
  const incl=i.questoes.filter(q=>q.incluir).length;
  return `<section>
    <h2>Importar de PDF</h2>
    <p class="sub">O PDF é lido aqui no seu aparelho. Confira as questões e o gabarito antes de adicionar ao banco. Funciona com PDF de texto (não escaneado).</p>

function ligarImportPDF(){
  const bind=(id,campo)=>{const el=document.getElementById(id); if(el) el["on"+(el.tagName==="SELECT"?"change":"input")]=()=>impPDF[campo]=el.value;};
  bind("ipDisc","disciplina"); bind("ipAssunto","assunto"); bind("ipSerie","serie"); bind("ipDif","dificuldade");
  const drop=document.getElementById("ipDrop"), file=document.getElementById("ipFile");
  if(drop&&file){ drop.onclick=()=>file.click();
    drop.ondragover=e=>e.preventDefault();
    drop.ondrop=e=>{e.preventDefault(); if(e.dataTransfer.files[0]) lerPDFapp(e.dataTransfer.files[0]);};
    file.onchange=e=>{ if(e.target.files[0]) lerPDFapp(e.target.files[0]); };
  }
  const sr=document.getElementById("ipSoRev"); if(sr) sr.onchange=()=>{impPDF.soRevisar=sr.checked; render();};
  document.querySelectorAll(".ipEnun").forEach(t=>t.oninput=()=>{impPDF.questoes[+t.dataset.qi].enunciado=t.value;});
  document.querySelectorAll(".ipAlt").forEach(inp=>inp.oninput=()=>{impPDF.questoes[+inp.dataset.qi].alternativas[+inp.dataset.ai].texto=inp.value;});
}
function impIncluir(qi){ const q=impPDF.questoes[qi]; q.incluir=!q.incluir; render(); }
function impCorreta(qi,ai){ const q=impPDF.questoes[qi];
  q.alternativas.forEach((a,j)=>a.correta=(j===ai)); q.correta=q.alternativas[ai].letra;
  q.flags=q.flags.filter(f=>f!=="sem gabarito"&&f!=="gabarito fora das alternativas"); render(); }
function aplicarImagemQuestao(qi, file){
  if(!file || !file.type || !file.type.startsWith("image/")) return;
  lerImagemRedimensionada(file, url=>{ const q=impPDF.questoes[qi]; q.imagem=url; if(!q.imagemPos) q.imagemPos="antes"; render(); });
}
function impImagemArquivo(qi, input){ const f=input.files&&input.files[0]; aplicarImagemQuestao(qi, f); }
function impAlvo(qi){ impPasteAlvo=qi;
  document.querySelectorAll(".imgdrop").forEach(e=>e.classList.toggle("ativo", +e.dataset.qi===qi));

function impDropOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add("sobre"); }
function impDropLeave(ev){ ev.currentTarget.classList.remove("sobre"); }
function impDrop(ev, qi){
  ev.preventDefault(); ev.currentTarget.classList.remove("sobre");
  const dt=ev.dataTransfer; if(!dt) return;
  const file=[...(dt.files||[])].find(f=>f.type && f.type.startsWith("image/"));
  if(file){ aplicarImagemQuestao(qi, file); return; }
  // imagem arrastada de uma página (vem como item de arquivo)
  for(const it of (dt.items||[])){ if(it.type && it.type.startsWith("image/")){ const f=it.getAsFile(); if(f){ aplicarImagemQuestao(qi, f); return; } } }
}
function impColar(ev){
  const items=ev.clipboardData && ev.clipboardData.items; if(!items) return;
  const pegarImg=()=>{ for(const it of items){ if(it.type && it.type.startsWith("image/")){ const f=it.getAsFile(); if(f) return f; } } return null; };
  if(impPDF && aba==="importpdf" && impPasteAlvo!=null){ const f=pegarImg(); if(f){ ev.preventDefault(); aplicarImagemQuestao(impPasteAlvo, f); } return; }
  if(novaQ && aba==="cadastro" && !novaQ.imagem){ const f=pegarImg(); if(f){ ev.preventDefault(); lerImagemRedimensionada(f, ncSetImg); } return; }
}
document.addEventListener("paste", impColar);
function impImagemPos(qi, val){ impPDF.questoes[qi].imagemPos=val; render(); }
function impImagemRemover(qi){ const q=impPDF.questoes[qi]; delete q.imagem; delete q.imagemPos; render(); }
async function lerPDFapp(arquivo){
  if(!window.pdfjsLib){ impPDF.msg="A biblioteca de PDF não carregou (precisa de internet na primeira vez)."; render(); return; }
  if(arquivo.type!=="application/pdf"){ impPDF.msg="Esse arquivo não é um PDF."; render(); return; }
  impPDF.lendo=true; impPDF.msg=""; render();
  try{
    const buf=await arquivo.arrayBuffer();
    const doc=await pdfjsLib.getDocument({data:buf}).promise;
    const paginas=[];
    for(let p=1;p<=doc.numPages;p++){
      const page=await doc.getPage(p); const vp=page.getViewport({scale:1});
      const tc=await page.getTextContent();
      paginas.push({itens:tc.items.filter(t=>t.str).map(t=>({x:t.transform[4],y:vp.height-t.transform[5],w:t.width,str:t.str})),largura:vp.width});
    }
    const r=Extrator.extrair(paginas);
    impPDF.questoes=r.questoes; impPDF.lendo=false;
    if(!r.questoes.length) impPDF.msg="Não encontrei questões neste PDF. Ele pode estar em um formato diferente ou ser escaneado.";
    render();
  }catch(err){ impPDF.lendo=false; impPDF.msg="Não consegui ler este PDF ("+err.message+")."; render(); }
}
function adicionarAoBanco(){
  const meta=impPDF;
  const alvo=meta.questoes.filter(q=>q.incluir);
  let add=0, pulou=0;
  alvo.forEach(q=>{
    const alts=q.alternativas.filter(a=>a.texto.trim());
    const temCorreta=alts.some(a=>a.correta);
    if(alts.length<2 || !temCorreta){ pulou++; return; }
    state.questoes.push({
      id:nid(), disciplina:meta.disciplina.trim()||"História",
      assunto:meta.assunto.trim()||"Sem assunto",
      serie:meta.serie?parseInt(meta.serie,10):null, dificuldade:meta.dificuldade,
      enunciado:q.enunciado.trim(), fonte:q.fonte||"importado", ano:q.ano||null,
      alternativas:alts.map(a=>({letra:a.letra, texto:a.texto.trim(), correta:!!a.correta})),
      imagem:q.imagem||null, imagemPos:q.imagemPos||null,
    });
    add++;
  });
  impPDF=null; filtro={assunto:"",dif:""}; setAba("banco");
  toast(`${add} questão(ões) adicionada(s) ao banco`+(pulou?` · ${pulou} pulada(s) sem gabarito/poucas alternativas`:""));
}

function imprimirProva(id){
  const t=state.testes.find(x=>x.id===id); if(!t){ toast("Prova não encontrada."); return; }
  const qs=t.questaoIds.map(qid=>state.questoes.find(x=>x.id===qid)).filter(Boolean);

    const tipo=tipoDe(q);
    let alts="";
    if(tipo==="vf") alts=`<div class="pi-alt">( ) Verdadeiro &nbsp;&nbsp; ( ) Falso</div>`;
    else if(tipo==="dissertativa") alts=`<div class="pi-linhas">${"<div class='pi-linha'></div>".repeat(5)}</div>`;
    else alts=(q.alternativas||[]).map(a=>`<div class="pi-alt">${a.letra}) ${esc(a.texto)}</div>`).join("");
    return `<div class="pi-q"><div class="pi-enun"><b>${i+1}.</b> ${esc(q.enunciado)}${q.fonte?` <i>(${esc(q.fonte)}${q.ano?" "+q.ano:""})</i>`:""}</div>${alts}</div>`;
  }).join("");
  const gab=qs.map((q,i)=>{
    const tipo=tipoDe(q); let r="—";
    if(tipo==="vf") r=q.gabaritoVF?"V":"F";
    else if(tipo==="multipla_escolha"){ const c=(q.alternativas||[]).find(a=>a.correta); r=c?c.letra:"—"; }
    else r="diss.";
    return `<span class="pi-g">${i+1}-${r}</span>`;
  }).join(" ");
  const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(t.titulo)}</title>
    <style>
      *{box-sizing:border-box}
      body{font-family:Georgia,"Times New Roman",serif; color:#111; margin:28px; line-height:1.4}
      h1{font-size:18px; margin:0 0 2px} .pi-sub{font-size:12px; color:#444; margin:0 0 14px}
      .pi-ident{border:1px solid #000; padding:8px 10px; font-size:12px; margin-bottom:16px}
      .pi-q{margin:0 0 14px; page-break-inside:avoid} .pi-enun{font-size:13px; margin-bottom:4px; text-align:justify}
      .pi-alt{font-size:13px; margin:2px 0 2px 16px}
      .pi-linhas{margin:6px 0 0 16px} .pi-linha{border-bottom:1px solid #999; height:20px}
      .pi-gab{margin-top:22px; padding-top:10px; border-top:1px dashed #999; font-size:12px}
      .pi-g{display:inline-block; margin:0 8px 4px 0; font-variant-numeric:tabular-nums}
      @media print{ body{margin:14mm} .pi-noprint{display:none} button{display:none} }
    </style></head><body>
    <h1>${esc(t.titulo)}</h1>
    <p class="pi-sub">${provaAlvoNome(t)} · ${qs.length} questões${t.tempoLimiteMin?` · ${t.tempoLimiteMin} min`:""}</p>
    <div class="pi-ident">Nome: _____________________________________________  Turma: __________  Data: ____/____/______</div>
    ${corpo}
    <div class="pi-gab"><b>Gabarito (para o professor):</b><br>${gab}</div>
    <div class="pi-noprint" style="margin-top:20px; text-align:center">
      <button onclick="window.print()" style="padding:8px 16px; font-size:14px; cursor:pointer">🖨 Imprimir</button>
    </div>
  </body></html>`;
  const w=window.open("", "_blank");
  if(!w){ toast("O navegador bloqueou a janela. Permita pop-ups para imprimir."); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

function aplicarFonteAluno(){
  const app=document.getElementById("app");
  if(app) app.style.setProperty("--fa", (papel==="aluno"? fonteAluno : 1).toString());
}
function ajustarFonteAluno(d){
  fonteAluno=Math.min(1.4, Math.max(0.85, Math.round((fonteAluno+d)*100)/100));
  aplicarFonteAluno();
  const el=document.getElementById("faPct"); if(el) el.textContent=Math.round(fonteAluno*100)+"%";
}

        <optgroup label="Turma específica">${state.turmas.map(t=>`<option value="turma:${t.id}" ${montando.alvo===("turma:"+t.id)?"selected":""}>${esc(t.nome)}</option>`).join("")}</optgroup>
        <optgroup label="Série inteira (todas as turmas)">${series.map(s=>`<option value="serie:${s}" ${montando.alvo===("serie:"+s)?"selected":""}>${s}ª série — todas as turmas</option>`).join("")}</optgroup>
      </select></div>
      <div><label>Tempo limite (min, opcional)</label><input id="mtTempo" type="number" min="1" value="${montando.tempo||""}" placeholder="ex.: 30"></div>

      <div><label>Modo</label><select id="mtModo">
        <option value="prova" ${montando.modo!=="estudo"?"selected":""}>Prova (nota só no fim)</option>
        <option value="estudo" ${montando.modo==="estudo"?"selected":""}>Estudo (mostra a resposta na hora)</option></select></div>
      <div><label>Filtrar por assunto</label><select id="mtFiltro" onchange="render()">
        <option value="">Todos</option>${assuntos.map(a=>`<option ${montando.filtro===a?"selected":""}>${a}</option>`).join("")}</select></div>
    </div>
    <p class="sub" style="margin:8px 0 0">Na série inteira, cada aluno escolhe a própria turma ao entrar na prova.</p>
    <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:12px">
      <label class="check" style="margin:0"><input type="checkbox" id="mtRevisao" ${montando.revisao?"checked":""}>
        <span>Mostrar a revisão ao aluno no fim <span class="sub">(evita repasse de respostas)</span></span></label>
      <label class="check" style="margin:0"><input type="checkbox" id="mtEmb" ${montando.embaralhar!==false?"checked":""}>
        <span>Embaralhar a ordem das questões</span></label>
    </div>
    <div class="row" style="margin-top:14px; align-items:flex-end">
      <div style="max-width:200px"><label>Sortear aleatórias (do filtro)</label>
        <input id="mtQtd" type="number" min="1" placeholder="ex.: 10"></div>
      <button class="sec" onclick="sortearQuestoes()">+ Sortear</button>
    </div>
    <div class="row" style="margin-top:14px; align-items:flex-end; gap:12px; background:var(--bg); border:1px solid var(--linha); border-radius:9px; padding:10px 12px">
      <label class="check" style="margin:0"><input type="checkbox" id="mtSortA" ${montando.sorteioAluno?"checked":""}>
        <span>Sorteio por aluno <span class="sub">(cada aluno recebe questões diferentes — anticola)</span></span></label>
      <div style="max-width:170px"><label>Quantas por aluno</label>
        <input id="mtSortQtd" type="number" min="1" value="${montando.sorteioQtd||""}" placeholder="ex.: 5" ${montando.sorteioAluno?"":"disabled"}></div>
    </div>
    <p class="sub" style="margin-top:6px">Com o sorteio por aluno ligado, as questões marcadas abaixo formam o <b>conjunto</b> de onde cada aluno recebe a quantidade indicada.</p>
    <p class="sub" style="margin-top:10px">Marque as questões (ou use o sorteio acima):</p>
    <div id="mtLista">${listaMarcavel()}</div>
    <div class="row">
      <button class="acao" onclick="salvarProva()">${montando.editId?"Salvar alterações":"Criar prova"}</button>
      <button class="sec" onclick="montando=null;setAba('provas')">Cancelar</button>
      <span class="sub" id="mtConta">${montando.ids.length} marcada(s)</span>

}
function listaMarcavel(){
  const f = (montando&&montando.filtro)||"";
  const qs=state.questoes.filter(q=>!f||q.assunto===f);
  return qs.map(q=>`<div class="qsel ${montando.ids.includes(q.id)?"sel":""}">
    <div class="qsel-top">
      <input type="checkbox" data-id="${q.id}" ${montando.ids.includes(q.id)?"checked":""}>
      <span class="qsel-enun" onclick="this.closest('.qsel').classList.toggle('aberta')">
        <span class="tag">${q.assunto}</span> ${esc(q.enunciado)} <span class="caret">▾ ver alternativas</span></span>
    </div>
    ${altsPreview(q)}
  </div>`).join("");
}
function ligarMontagem(){
  const filtroEl=document.getElementById("mtFiltro");
  if(filtroEl) filtroEl.onchange=()=>{montando.filtro=filtroEl.value; document.getElementById("mtLista").innerHTML=listaMarcavel(); marcarCheckboxes();};
  marcarCheckboxes();
  const t=document.getElementById("mtTit"); if(t) t.oninput=()=>montando.titulo=t.value;
  const al=document.getElementById("mtAlvo"); if(al) al.onchange=()=>montando.alvo=al.value;
  const te=document.getElementById("mtTempo"); if(te) te.oninput=()=>montando.tempo=te.value;
  const fc=document.getElementById("mtFecha"); if(fc) fc.onchange=()=>montando.fechaEm=fc.value;
  const rv=document.getElementById("mtRevisao"); if(rv) rv.onchange=()=>montando.revisao=rv.checked;
  const emb=document.getElementById("mtEmb"); if(emb) emb.onchange=()=>montando.embaralhar=emb.checked;
  const mo=document.getElementById("mtModo"); if(mo) mo.onchange=()=>montando.modo=mo.value;
  const sa=document.getElementById("mtSortA"); if(sa) sa.onchange=()=>{ montando.sorteioAluno=sa.checked; const q=document.getElementById("mtSortQtd"); if(q) q.disabled=!sa.checked; };
  const sq=document.getElementById("mtSortQtd"); if(sq) sq.oninput=()=>montando.sorteioQtd=sq.value;
}
function sortearQuestoes(){
  const el=document.getElementById("mtQtd"); const n=parseInt((el&&el.value)||"0",10);
  if(!n||n<1){ toast("Informe quantas questões sortear."); return; }
  const f=montando.filtro||"";
  const pool=state.questoes.filter(q=>(!f||q.assunto===f) && !montando.ids.includes(q.id));
  if(!pool.length){ toast("Não há questões disponíveis nesse filtro."); return; }
  const sorteadas=embaralhar(pool).slice(0,n).map(q=>q.id);
  montando.ids=[...montando.ids, ...sorteadas];
  render();
  toast(`${sorteadas.length} questão(ões) sorteada(s).`);
}
function marcarCheckboxes(){
  document.querySelectorAll('#mtLista input[type=checkbox]').forEach(cb=>{
    cb.onchange=()=>{ const id=cb.dataset.id;
      if(cb.checked){ if(!montando.ids.includes(id)) montando.ids.push(id); }
      else montando.ids=montando.ids.filter(x=>x!==id);
      document.getElementById("mtConta").textContent=`${montando.ids.length} marcada(s)`; };
  });
}
function salvarProva(){
  if(!montando.titulo.trim()||montando.ids.length===0){ toast("Dê um título e marque ao menos uma questão."); return; }
  const [atipo, aval]=(montando.alvo||"").split(":");
  if(!aval){ toast("Escolha para qual turma ou série é a prova."); return; }
  const fechaTs = montando.fechaEm ? new Date(montando.fechaEm+"T23:59:59").getTime() : null;
  const ehSerie = atipo==="serie";
  const sortA = !!montando.sorteioAluno;
  const sortN = sortA ? (parseInt(montando.sorteioQtd||"0",10)||0) : null;
  if(sortA && (!sortN || sortN>montando.ids.length)){ toast("No sorteio por aluno, informe de 1 até o total de questões do conjunto."); return; }
  if(montando.editId){
    const t=state.testes.find(x=>x.id===montando.editId); if(!t) return;
    t.titulo=montando.titulo.trim(); t.questaoIds=[...montando.ids];
    t.tempoLimiteMin=montando.tempo?parseInt(montando.tempo,10):null;
    t.mostrarRevisao=!!montando.revisao; t.fechaEm=fechaTs;
    t.alvoTipo= ehSerie?"serie":"turma"; t.serie= ehSerie?aval:null; t.turmaId= ehSerie?null:aval;
    t.embaralhar= montando.embaralhar!==false; t.modo= montando.modo||"prova";
    t.sorteioAluno= sortA; t.sorteioQtd= sortN;
    montando=null; setAba("provas"); return;
  }
  const seq=state.testes.length+1;
  let base = ehSerie ? ("S"+aval) : ((state.turmas.find(t=>t.id===aval)||{}).nome||"").replace(/[^A-Za-z0-9]/g,"");
  base=(base||"PROVA").toUpperCase().slice(0,6);
  const codigo=`HIST-${base}-${String(seq).padStart(2,"0")}`;
  state.testes.push({id:nid(), titulo:montando.titulo.trim(), codigo,
    alvoTipo: ehSerie?"serie":"turma", serie: ehSerie?aval:null, turmaId: ehSerie?null:aval,
    questaoIds:[...montando.ids], embaralhar: montando.embaralhar!==false, modo: montando.modo||"prova",
    sorteioAluno: sortA, sorteioQtd: sortN, status:"publicado",
    tempoLimiteMin: montando.tempo? parseInt(montando.tempo,10): null,
    mostrarRevisao: !!montando.revisao, fechaEm:fechaTs});
  montando=null; setAba("provas");
}

function abrirBoletim(rid){ boletimSel=rid; render(); }
function fecharBoletim(){ boletimSel=null; render(); }
function telaBoletim(){
  const r=state.respostas.find(x=>x.id===boletimSel);
  if(!r){ boletimSel=null; return telaResultados(); }
  const t=state.testes.find(x=>x.id===r.testeId);
  const itens=(r.respostas||[]);
  const linhas=itens.map((it,i)=>{
    const q=state.questoes.find(x=>x.id===it.questaoId); if(!q) return "";
    const tipo=it.tipo||tipoDe(q); const dada=it.resposta||it.letra||null;
    let marca, corpo;
    if(tipo==="dissertativa"){
      marca= it.obtidos==null?`<span class="sub">a corrigir</span>`:(it.correta?`<span class="certo">✓</span>`:`<span class="errado">✗</span>`);
      corpo=`<div>Resposta: ${dada||it.textoResposta?esc(it.textoResposta||dada):"<span class='sub'>(em branco)</span>"}</div>`;
    } else if(tipo==="vf"){
      marca= it.correta?`<span class="certo">✓ acertou</span>`:`<span class="errado">✗ errou</span>`;
      const sua=dada==="V"?"Verdadeiro":dada==="F"?"Falso":"(em branco)";
      corpo=`<div>Marcou: ${esc(sua)} · Gabarito: ${q.gabaritoVF?"Verdadeiro":"Falso"}</div>`;
    } else {
      marca= it.correta?`<span class="certo">✓ acertou</span>`:`<span class="errado">✗ errou</span>`;
      const corr=(q.alternativas||[]).find(a=>a.correta);
      corpo=`<div>Marcou: ${it.textoResposta?esc(it.textoResposta):(dada?esc(dada):"<span class='sub'>(em branco)</span>")}</div>
        ${!it.correta&&corr?`<div class="certo">Correta: ${esc(corr.texto)}</div>`:""}`;
    }
    return `<div class="fb"><div class="fbh"><span>Questão ${i+1} <span class="tag">${esc(q.assunto||"—")}</span></span>${marca}</div>
      <div class="sub" style="margin:0 0 4px">${esc(q.enunciado).slice(0,140)}${q.enunciado.length>140?"…":""}</div>
      ${corpo}
      ${q.resolucao?`<div class="resol">💬 ${esc(q.resolucao)}</div>`:""}</div>`;
  }).join("");
  const objetivas=itens.filter(x=>(x.tipo||"")!=="dissertativa" && x.correta!=null);
  const acertos=objetivas.filter(x=>x.correta===true).length;
  return `<section>
    <div class="row" style="margin-top:0"><button class="sec" onclick="fecharBoletim()">← Voltar aos resultados</button></div>
    <h2 style="margin-top:12px">${esc(r.nome)}</h2>
    <p class="sub">${t?esc(t.titulo):""} · turma ${esc(turmaNome(respTurmaId(r)))}</p>
    <div class="kpi" style="margin-top:4px">
      <div><div class="n">${r.nota.toFixed(1)}${r.pendente?"*":""}</div><div class="r">${r.pendente?"nota parcial":"nota"}</div></div>
      <div><div class="n">${acertos}/${objetivas.length}</div><div class="r">acertos (objetivas)</div></div>
      <div><div class="n">${itens.length}</div><div class="r">questões</div></div>
    </div>
    ${r.pendente?`<p class="sub">* há dissertativas aguardando correção.</p>`:""}
    <h2 style="margin-top:14px; font-size:.92rem">Questão a questão</h2>
    ${linhas||'<p class="vazio">Sem detalhes.</p>'}
  </section>`;
}
function telaResultados(){
  if(state.testes.length===0) return `<section><p class="vazio">Nenhuma prova ainda.</p></section>`;
  if(boletimSel) return telaBoletim();
  const t=state.testes.find(x=>x.id===provaSel)||state.testes[0]; provaSel=t.id;
  const relevantes=provaTurmas(t);
  let turmaFiltro=resultTurma; if(turmaFiltro && !relevantes.some(x=>x.id===turmaFiltro)) turmaFiltro="";
  const respAll=state.respostas.filter(r=>r.testeId===t.id);
  const resp = turmaFiltro ? respAll.filter(r=>respTurmaId(r)===turmaFiltro) : respAll;
  const mostrarTurma = !turmaFiltro && relevantes.length>1;
  const respOrdenadas = resp.slice().sort((a,b)=> normNome(a.nome)<normNome(b.nome)?-1:1);
  const notas=resp.map(r=>r.nota).filter(n=>typeof n==="number");
  const media = notas.length? (notas.reduce((s,n)=>s+n,0)/notas.length).toFixed(1) : "—";
  const qsT=t.questaoIds.map(id=>state.questoes.find(q=>q.id===id)).filter(Boolean);
  const temDissert=qsT.some(q=>tipoDe(q)==="dissertativa");
  const temas={};
  t.questaoIds.forEach(qid=>{ const q=state.questoes.find(x=>x.id===qid); if(!q) return; const tema=q.assunto||"—";
    temas[tema]=temas[tema]||{ac:0,tot:0};
    resp.forEach(r=>{ const it=(r.respostas||[]).find(x=>x.questaoId===qid); if(it&&it.correta!=null){ temas[tema].tot++; if(it.correta) temas[tema].ac++; } });
  });
  const temasArr=Object.entries(temas).map(([tema,v])=>({tema,pct:v.tot?Math.round(v.ac/v.tot*100):null})).filter(x=>x.pct!=null).sort((a,b)=>a.pct-b.pct);
  const erroQ=t.questaoIds.map(qid=>{ const q=state.questoes.find(x=>x.id===qid); let tot=0,err=0;
    resp.forEach(r=>{ const it=(r.respostas||[]).find(x=>x.questaoId===qid); if(it&&it.correta!=null){ tot++; if(!it.correta) err++; } });
    return {q,pct:tot?Math.round(err/tot*100):null};
  }).filter(x=>x.pct!=null).sort((a,b)=>b.pct-a.pct);
  return `<section>
    <h2>Resultados</h2>
    <label>Prova</label>
    <select onchange="provaSel=this.value;render()">${state.testes.map(x=>`<option value="${x.id}" ${x.id===t.id?"selected":""}>${esc(x.titulo)} — ${x.codigo}</option>`).join("")}</select>
    ${relevantes.length>1?`<label style="margin-top:10px">Turma</label>
      <select onchange="resultTurma=this.value;render()">
        <option value="">Todas as turmas (${provaAlvoNome(t)})</option>
        ${relevantes.map(x=>`<option value="${x.id}" ${turmaFiltro===x.id?"selected":""}>${esc(x.nome)}</option>`).join("")}
      </select>`:""}
    <div class="kpi" style="margin-top:14px">
      <div><div class="n">${media}</div><div class="r">média${turmaFiltro?" ("+esc((relevantes.find(x=>x.id===turmaFiltro)||{}).nome||"")+")":""}</div></div>
      <div><div class="n">${resp.length}</div><div class="r">responderam</div></div>
      <div><div class="n">${t.questaoIds.length}</div><div class="r">questões</div></div>
    </div>
    <div class="row" style="margin-top:6px"><button class="sec" onclick="exportarCSV('${t.id}')">⬇ Exportar notas (CSV)</button>${CONECTADO?`<button class="sec" onclick="recarregarResultados()">↻ Atualizar respostas</button>`:""}</div>
    <h2 style="margin-top:16px; font-size:.92rem">Por aluno</h2>
    ${respOrdenadas.map(r=>{
      const tn = mostrarTurma? ` <span class="sub">(${esc(turmaNome(respTurmaId(r)))})</span>`:"";
      const val=r.pendente?`${r.nota.toFixed(1)}* <span class="sub">a corrigir</span>`:r.nota.toFixed(1);
      return `<div class="aluno-linha linha-click" onclick="abrirBoletim('${r.id}')"><span>${esc(r.nome)}${tn} <span class="sub">ver →</span></span><span class="nota">${val}</span></div>`;
    }).join("")||'<p class="vazio">Ninguém respondeu ainda.</p>'}
    ${temDissert?`<h2 style="margin-top:16px; font-size:.92rem">Corrigir dissertativas</h2>${corrigirDissertativasHTML(t,resp)}`:""}
    <h2 style="margin-top:16px; font-size:.92rem">Desempenho por tema</h2>
    <div class="barra-wrap">${temasArr.length? temasArr.map(e=>`
      <div class="barra-item"><div class="barra-top"><span>${esc(e.tema)}</span><span>${e.pct}% acerto</span></div>
      <div class="barra ok"><i style="width:${e.pct}%"></i></div></div>`).join("") : '<p class="vazio">Sem respostas objetivas ainda.</p>'}</div>
    <h2 style="margin-top:16px; font-size:.92rem">Questões que mais erraram</h2>
    <div class="barra-wrap">${erroQ.length? erroQ.map(e=>`
      <div class="barra-item"><div class="barra-top"><span>${esc(e.q.assunto)}</span><span>${e.pct}% erro</span></div>
      <div class="barra"><i style="width:${e.pct}%"></i></div></div>`).join("") : '<p class="vazio">Sem respostas objetivas ainda.</p>'}</div>
  </section>`;
}
function corrigirDissertativasHTML(t, resp){
  const dqs=t.questaoIds.map(id=>state.questoes.find(q=>q.id===id)).filter(q=>q&&tipoDe(q)==="dissertativa");
  if(!resp.length) return '<p class="vazio">Sem respostas ainda.</p>';
  return dqs.map(q=>`<div class="turmacard">
    <div style="font-weight:600">${esc(q.enunciado).slice(0,100)}${q.enunciado.length>100?"…":""} <span class="sub">(vale ${pontosDe(q)})</span></div>
    ${q.resolucao?`<div class="sub" style="margin-top:4px">Esperado: ${esc(q.resolucao)}</div>`:""}
    ${resp.map(r=>{ const it=(r.respostas||[]).find(x=>x.questaoId===q.id); if(!it) return "";
      return `<div class="alunoitem" style="align-items:flex-start; gap:8px">
        <span style="flex:1"><b>${esc(r.nome)}:</b> ${it.resposta?esc(it.resposta):"<span class='sub'>(em branco)</span>"}</span>
        <input class="notaedit" type="number" min="0" max="${pontosDe(q)}" step="0.5" value="${it.obtidos==null?"":it.obtidos}" placeholder="0–${pontosDe(q)}"
          onchange="corrigirDissertativa('${r.id}','${q.id}',this.value)"></div>`;
    }).join("")}
  </div>`).join("");
}
function corrigirDissertativa(respId, qid, valor){
  const r=state.respostas.find(x=>x.id===respId); if(!r) return;
  const it=(r.respostas||[]).find(x=>x.questaoId===qid); if(!it) return;
  const q=state.questoes.find(x=>x.id===qid); const max=pontosDe(q);
  if(valor===""||valor==null) it.obtidos=null;
  else { let v=parseFloat(valor); if(isNaN(v)) v=0; it.obtidos=Math.max(0,Math.min(max,v)); }
  const rec=calcNota(r.respostas); r.nota=rec.nota; r.pendente=rec.pendente; render();
}
function exportarCSV(testeId){
  const t=state.testes.find(x=>x.id===testeId);
  const relevantes=provaTurmas(t);
  let turmaFiltro=resultTurma; if(turmaFiltro && !relevantes.some(x=>x.id===turmaFiltro)) turmaFiltro="";
  let resp=state.respostas.filter(r=>r.testeId===testeId);
  if(turmaFiltro) resp=resp.filter(r=>respTurmaId(r)===turmaFiltro);
  resp=resp.slice().sort((a,b)=> normNome(turmaNome(respTurmaId(a))+a.nome)<normNome(turmaNome(respTurmaId(b))+b.nome)?-1:1);
  const linhas=[["Turma","Aluno","Nota","Situação"]];
  resp.forEach(r=> linhas.push([turmaNome(respTurmaId(r)), r.nome, String(r.nota).replace(".",","), r.pendente?"a corrigir":"corrigida"]));
  const csv=linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`notas_${t.codigo||"prova"}.csv`; a.click();
}

function viewAluno(){
  if(!sessaoAluno) return telaEntrada();
  if(sessaoAluno.enviado) return telaFim();
  return telaResponder();
}
let provaAluno=null;   // prova carregada do servidor para o aluno responder
// busca a questão pela sessão do aluno (servidor) ou pelo banco local (modo demo)
function qDaSessao(qid){ const s=sessaoAluno; if(s&&s.qmap&&s.qmap[qid]) return s.qmap[qid]; return state.questoes.find(x=>x.id===qid); }

async function buscarProva(){
  const cod=(document.getElementById("alCod").value||"").trim().toUpperCase();
  const msg=t=>{const m=document.getElementById("alMsg"); if(m) m.textContent=t;};
  if(!cod){ msg("Digite o código da prova."); return; }
  if(CONECTADO){
    msg("Buscando…");
    const {data,error}=await sb.rpc('prova_por_codigo',{p_codigo:cod});
    if(error){ msg("Não consegui buscar a prova. Verifique a conexão."); return; }
    if(!data || data.erro){ msg(data&&data.erro==="encerrada"?"Esta prova está encerrada.":"Código não encontrado."); return; }
    provaAluno=data; msg(""); render();
    return;
  }
  // modo demonstração (sem Supabase): monta a prova a partir do banco local
  const t=state.testes.find(x=>x.codigo.toUpperCase()===cod);
  if(!t){ msg("Código não encontrado. Tente HIST-3A-01."); return; }
  if(!provaAberta(t)){ msg("Esta prova está encerrada."); return; }
  // modo demo não tem camada anônima: mantém o gabarito local (a correção é no navegador)
  provaAluno={ id:t.id, titulo:t.titulo, codigo:t.codigo, alvoTipo:t.alvoTipo, serie:t.serie, turmaId:t.turmaId,
    embaralhar:t.embaralhar, modo:t.modo, sorteioAluno:t.sorteioAluno, sorteioQtd:t.sorteioQtd,
    tempoLimiteMin:t.tempoLimiteMin, mostrarRevisao:t.mostrarRevisao,
    questoes:t.questaoIds.map(id=>state.questoes.find(q=>q.id===id)).filter(Boolean).map(q=>({
      id:q.id, tipo:tipoDe(q), enunciado:q.enunciado, imagem:q.imagem, imagemPos:q.imagemPos, assunto:q.assunto,
      pontos:pontosDe(q), gabaritoVF:q.gabaritoVF, resolucao:q.resolucao,
      alternativas:(q.alternativas||[]).map(a=>({letra:a.letra, texto:a.texto, imagem:a.imagem, correta:a.correta})) })),
    turmas:provaTurmas(t).map(x=>({id:x.id, nome:x.nome, serie:x.serie})) };
  msg(""); render();
}
function comecarProva(){
  const msg=t=>{const m=document.getElementById("alMsg"); if(m) m.textContent=t;};
  const p=provaAluno; if(!p) return;
  const nome=((document.getElementById("alNome")||{}).value||"").trim();
  const turmaId=(document.getElementById("alTurma")||{}).value||"";
  if(!nome){ msg("Digite seu nome completo."); return; }
  if(nome.split(/\s+/).length<2){ msg("Digite seu nome completo (nome e sobrenome)."); return; }
  if(!turmaId){ msg("Escolha sua turma."); return; }
  const qmap={}; (p.questoes||[]).forEach(q=>qmap[q.id]=q);
  let ordem=(p.questoes||[]).map(q=>q.id);
  if(p.sorteioAluno && p.sorteioQtd){ ordem=embaralhar(ordem).slice(0, p.sorteioQtd); }
  else if(p.embaralhar){ ordem=embaralhar(ordem); }
  const altsPorQ={}; const letras=["A","B","C","D","E","F","G"];
  ordem.forEach(qid=>{ const q=qmap[qid]; if(!q||q.tipo!=="multipla_escolha") return;
    let alts=(q.alternativas||[]).map(a=>({...a}));
    if(p.embaralhar) alts=embaralhar(alts);
    alts=alts.map((a,idx)=>({...a, letra:letras[idx]||a.letra}));
    altsPorQ[qid]=alts; });
  const prazo = p.tempoLimiteMin ? Date.now()+p.tempoLimiteMin*60000 : null;
  sessaoAluno={teste:p, qmap, nome, turmaId, ordem, altsPorQ, respostas:{}, revelado:{}, atual:0, enviado:false, prazo};
  render();
}
// ---- cronômetro ----
function iniciarCronometro(){
  if(cronoInterval) return; // já rodando
  tickCronometro();
  cronoInterval=setInterval(tickCronometro,1000);
}
function pararCronometro(){ if(cronoInterval){ clearInterval(cronoInterval); cronoInterval=null; } }
function tickCronometro(){
  if(!sessaoAluno || !sessaoAluno.prazo || sessaoAluno.enviado){ pararCronometro(); return; }
  const rem=Math.max(0, Math.round((sessaoAluno.prazo-Date.now())/1000));
  const el=document.getElementById("cronometro");
  if(el){
    el.textContent=`${String(Math.floor(rem/60)).padStart(2,"0")}:${String(rem%60).padStart(2,"0")}`;
    const bar=document.getElementById("cronobar"); if(bar) bar.classList.toggle("urgente", rem<=60);
  }
  if(rem<=0){ pararCronometro(); enviarAluno(true); }
}
function qtdRespondidas(s){ return s.ordem.filter(qid=>{ const v=s.respostas[qid]; return v!==undefined && v!==null && String(v).trim()!==""; }).length; }
function estudoOn(s){ return !!(s && s.teste && s.teste.modo==="estudo"); }
function reveladoQ(s,qid){ return estudoOn(s) && s.revelado && s.revelado[qid]; }
function altHTML(qid,a){
  const s=sessaoAluno; const rev=reveladoQ(s,qid); const sel=s.respostas[qid]===a.letra;
  let cls="alt";
  if(rev){ if(a.correta) cls+=" certa"; else if(sel) cls+=" errada"; }
  else if(sel) cls+=" sel";
  const click= rev ? "" : `onclick="marcar('${qid}','${a.letra}')"`;
  return `<div class="${cls}" data-q="${qid}" data-letra="${a.letra}" ${click}>
    <span class="l">${a.letra}</span><span>${esc(a.texto)}${a.imagem?`<img class="altimg" src="${a.imagem}">`:""}</span></div>`;
}
function feedbackEstudoHTML(s,qid){
  const q=qDaSessao(qid); const tipo=tipoDe(q); const raw=s.respostas[qid];
  let cab="";
  if(tipo==="dissertativa"){
    cab=`<span class="sub">Compare sua resposta com a resolução abaixo.</span>`;
  } else {
    let ok=false, correta="";
    if(tipo==="vf"){ ok=(raw==="V"||raw==="F") && ((raw==="V")===!!q.gabaritoVF); correta=q.gabaritoVF?"Verdadeiro":"Falso"; }
    else { const alts=s.altsPorQ[qid]||[]; const e=raw?alts.find(a=>a.letra===raw):null; ok=e?!!e.correta:false; const c=alts.find(a=>a.correta); correta=c?("alternativa "+c.letra):""; }
    cab= ok?`<span class="certo">✓ Você acertou</span>`:`<span class="errado">✗ Resposta incorreta${correta?" · correta: "+esc(correta):""}</span>`;
  }
  return `<div class="estudo-fb">${cab}${q.resolucao?`<div class="resol">💬 ${esc(q.resolucao)}</div>`:""}</div>`;
}
function corpoQuestao(s, qid){
  const q=qDaSessao(qid); const tipo=tipoDe(q); const rev=reveladoQ(s,qid);
  let body;
  if(tipo==="vf"){
    body=["V","F"].map(v=>{
      const sel=s.respostas[qid]===v; let cls="alt";
      if(rev){ if((v==="V")===!!q.gabaritoVF) cls+=" certa"; else if(sel) cls+=" errada"; }
      else if(sel) cls+=" sel";
      const click= rev ? "" : `onclick="marcar('${qid}','${v}')"`;
      return `<div class="${cls}" data-q="${qid}" data-letra="${v}" ${click}><span class="l">${v}</span><span>${v==="V"?"Verdadeiro":"Falso"}</span></div>`;
    }).join("");
  } else if(tipo==="dissertativa"){
    body=`<textarea class="dissert" data-q="${qid}" placeholder="Digite sua resposta" oninput="marcarTexto('${qid}', this.value)" style="min-height:120px">${esc(s.respostas[qid]||"")}</textarea>`;
    if(estudoOn(s) && !rev && q.resolucao) body+=`<div class="row" style="margin-top:8px"><button class="sec" onclick="revelarEstudo('${qid}')">Ver resolução</button></div>`;
  } else {
    body=(s.altsPorQ[qid]||[]).map(a=>altHTML(qid,a)).join("");
  }
  if(estudoOn(s) && rev) body+=feedbackEstudoHTML(s,qid);
  return body;
}
function revelarEstudo(qid){ const s=sessaoAluno; s.revelado=s.revelado||{}; s.revelado[qid]=true; render(); }
function telaResponder(){
  const s=sessaoAluno;
  const N=s.ordem.length;
  const i=Math.min(Math.max(s.atual||0,0), N-1);
  const qid=s.ordem[i]; const q=qDaSessao(qid); const tipo=tipoDe(q);
  return `<section>

    <div class="qhead-aluno"><h2 style="margin:0">${esc(s.teste.titulo)}</h2>
      <span class="sub">Questão ${i+1} de ${N}${s.prazo?" · cronometrada":""}${estudoOn(s)?" · modo estudo (mostra a resposta na hora)":""}</span></div>
    <div class="fonte-ctrl">
      <span class="sub">Tamanho da letra</span>
      <button class="sec" onclick="ajustarFonteAluno(-0.1)" aria-label="Diminuir">A−</button>
      <span class="sub" id="faPct">${Math.round(fonteAluno*100)}%</span>
      <button class="sec" onclick="ajustarFonteAluno(0.1)" aria-label="Aumentar">A+</button>
    </div>
    <div class="q" style="margin-top:12px; font-size:calc(1rem * var(--fa,1))">
      <div style="font-weight:600; margin-bottom:6px">Questão ${i+1} <span class="tag">${rotuloTipo(tipo)}</span></div>
      ${enunciadoComImagem(q)}
      ${corpoQuestao(s, qid)}
    </div>
    <div class="navnav">
      <button class="sec" onclick="irAnterior()" ${i===0?"disabled":""}>← Anterior</button>

    </div>

      const v=s.respostas[id]; const resp = v!==undefined && v!==null && String(v).trim()!=="";

    }).join("")}</div>

function irPara(j){ sessaoAluno.atual=j; render(); }
function irProxima(){ if(sessaoAluno.atual<sessaoAluno.ordem.length-1){ sessaoAluno.atual++; render(); } }
function irAnterior(){ if(sessaoAluno.atual>0){ sessaoAluno.atual--; render(); } }
function atualizarContagem(){
  const c=document.getElementById("alContagem");
  if(c) c.textContent=`${qtdRespondidas(sessaoAluno)} de ${sessaoAluno.ordem.length} respondidas`;
}
function atualizarNavDot(qid){
  const j=sessaoAluno.ordem.indexOf(qid); if(j<0) return;
  const el=document.querySelector(`.navq[data-nav="${j}"]`); if(!el) return;
  const v=sessaoAluno.respostas[qid]; el.classList.toggle("resp", v!==undefined&&v!==null&&String(v).trim()!=="");
}
function marcar(qid,letra){
  const s=sessaoAluno;
  if(reveladoQ(s,qid)) return; // no modo estudo, trava após revelar
  s.respostas[qid]=letra;
  if(estudoOn(s)){ s.revelado=s.revelado||{}; s.revelado[qid]=true; atualizarContagem(); atualizarNavDot(qid); render(); return; }
  document.querySelectorAll(`.alt[data-q="${qid}"]`).forEach(el=>{ el.classList.toggle("sel", el.dataset.letra===letra); });
  atualizarContagem(); atualizarNavDot(qid);
}
function marcarTexto(qid,val){ sessaoAluno.respostas[qid]=val; atualizarContagem(); atualizarNavDot(qid); }
function enviarAluno(auto){
  const s=sessaoAluno;
  if(!auto && qtdRespondidas(s)<s.ordem.length){ confirmar("Você deixou questões em branco. Enviar mesmo assim?", ()=>enviarAgora(false)); return; }
  enviarAgora(auto);
}
async function enviarAgora(auto){
  const s=sessaoAluno;
  pararCronometro();
  const payload=s.ordem.map(qid=>{
    const q=qDaSessao(qid); const tipo=tipoDe(q); const raw=s.respostas[qid];
    let textoResposta=null;
    if(tipo==="vf") textoResposta = raw==="V"?"Verdadeiro":raw==="F"?"Falso":null;
    else if(tipo==="dissertativa") textoResposta=(raw||"").trim()||null;
    else { const alts=s.altsPorQ[qid]||[]; const e=raw?alts.find(a=>a.letra===raw):null; textoResposta=e?e.texto:null; }
    return {questaoId:qid, resposta:raw||null, textoResposta};
  });

  if(CONECTADO){
    const {data,error}=await sb.rpc('enviar_resposta',{p_codigo:s.teste.codigo, p_nome:s.nome, p_turma_id:s.turmaId, p_respostas:payload});
    if(error){ toast("Falha ao enviar. Verifique a conexão e tente de novo."); return; }
    if(data&&data.erro){
      toast(data.erro==="ja_respondeu"?"Já existe uma resposta com esse nome nesta turma."
           :data.erro==="encerrada"?"Esta prova foi encerrada.":"Não foi possível enviar."); return;
    }
    s.notaFinal=Number(data.nota)||0; s.pendente=!!data.pendente; s.revisaoServidor=data.revisao||null; s.autoEnviado=!!auto;
    if(Array.isArray(data.revisao)){ const obj=data.revisao.filter(x=>x.tipo!=="dissertativa"); s.totalAuto=obj.length; s.acertos=obj.filter(x=>x.correta===true).length; }
    else { s.totalAuto=null; s.acertos=null; }
    s.enviado=true; render(); return;
  }

  // modo demonstração (sem Supabase): corrige localmente
  const respostas=payload.map(p=>{
    const q=qDaSessao(p.questaoId); const tipo=tipoDe(q); const pontos=pontosDe(q); const raw=p.resposta;
    if(tipo==="vf"){ const correta=(raw==="V"||raw==="F")?((raw==="V")===!!q.gabaritoVF):false;
      return {questaoId:p.questaoId, tipo, resposta:raw||null, correta, pontos, obtidos:correta?pontos:0}; }
    if(tipo==="dissertativa"){ return {questaoId:p.questaoId, tipo, resposta:p.textoResposta, correta:null, pontos, obtidos:null}; }
    const correta=(q.alternativas||[]).some(a=>a.correta && a.texto===p.textoResposta);
    return {questaoId:p.questaoId, tipo, resposta:raw||null, textoResposta:p.textoResposta, correta, pontos, obtidos:correta?pontos:0};
  });
  const {nota,pendente}=calcNota(respostas);
  const autogradaveis=respostas.filter(r=>r.tipo!=="dissertativa");
  s.notaFinal=nota; s.acertos=autogradaveis.filter(r=>r.correta).length; s.totalAuto=autogradaveis.length; s.pendente=pendente;
  s.registro=respostas; s.revisaoServidor=null; s.enviado=true; s.autoEnviado=!!auto; render();
}
function revisaoFimHTML(s){
  if(CONECTADO){
    if(!Array.isArray(s.revisaoServidor)) return "";
    return s.revisaoServidor.map((r,i)=>{
      let marca, linha;
      if(r.tipo==="dissertativa"){ marca=`<span class="sub">aguardando correção</span>`;
        linha=`<div>Sua resposta: ${r.suaResposta?esc(r.suaResposta):"<span class='sub'>(em branco)</span>"}</div>`; }

      else { marca=r.correta?`<span class="certo">✓ acertou</span>`:`<span class="errado">✗ errou</span>`;

               ${!r.correta&&r.corretaTexto?`<div class="certo">Correta: ${esc(r.corretaTexto)}</div>`:""}`; }

        <div class="sub" style="margin:0 0 4px">${esc(r.enunciado||"").slice(0,120)}${(r.enunciado||"").length>120?"…":""}</div>

    let linha, marca;
    if(tipo==="dissertativa"){ marca=`<span class="sub">aguardando correção</span>`;
      linha=`<div>Sua resposta: ${r.resposta?esc(r.resposta):"<span class='sub'>(em branco)</span>"}</div>`; }
    else if(tipo==="vf"){ const sua=r.resposta==="V"?"Verdadeiro":r.resposta==="F"?"Falso":"(em branco)";
      marca=r.correta?`<span class="certo">✓ acertou</span>`:`<span class="errado">✗ errou</span>`;
      linha=`<div>Sua resposta: ${esc(sua)} · Gabarito: ${q.gabaritoVF?"Verdadeiro":"Falso"}</div>`; }
    else { const corr=(q.alternativas||[]).find(a=>a.correta);
      marca=r.correta?`<span class="certo">✓ acertou</span>`:`<span class="errado">✗ errou</span>`;
      linha=`<div>Sua resposta: ${r.textoResposta?esc(r.textoResposta):"<span class='sub'>(em branco)</span>"}</div>
             ${!r.correta&&corr?`<div class="certo">Correta: ${esc(corr.texto)}</div>`:""}`; }
    return `<div class="fb"><div class="fbh"><span>Questão ${i+1}</span>${marca}</div>
      <div class="sub" style="margin:0 0 4px">${esc(q.enunciado).slice(0,120)}${q.enunciado.length>120?"…":""}</div>
      ${linha}${q.resolucao?`<div class="resol">💬 ${esc(q.resolucao)}</div>`:""}</div>`;
  }).join("");
}
function telaFim(){
  const s=sessaoAluno;
  const mostrar = !!s.teste.mostrarRevisao;
  const feedback = mostrar ? revisaoFimHTML(s) : "";
  const temAcertos = (s.totalAuto!=null);
  return `<section>
    <h2 style="text-align:center">Respostas enviadas</h2>
    <p class="sub" style="text-align:center">${esc(s.teste.titulo)}${s.autoEnviado?" · ⏱ tempo esgotado — enviada automaticamente":""}</p>
    <div class="kpi" style="justify-content:center; margin:16px 0">
      <div style="max-width:170px"><div class="n">${s.pendente?s.notaFinal.toFixed(1)+"*":s.notaFinal.toFixed(1)}</div><div class="r">${s.pendente?"nota parcial":"sua nota"}</div></div>
      ${temAcertos?`<div style="max-width:170px"><div class="n">${s.acertos}/${s.totalAuto}</div><div class="r">acertos (objetivas)</div></div>`:""}
    </div>
    ${s.pendente?`<p class="sub" style="text-align:center">* há questões dissertativas aguardando correção do professor.</p>`:""}
    ${mostrar
      ? `<h2 style="font-size:.95rem; margin-top:10px">Revisão</h2>${feedback}`
      : `<p class="sub" style="text-align:center; margin-top:10px">O professor não liberou o gabarito desta prova.</p>`}
    <div class="row" style="justify-content:center"><button class="sec" onclick="sessaoAluno=null;provaAluno=null;render()">Voltar ao início</button></div>
  </section>`;
}

// utilidades
function embaralhar(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// ================= persistência local (localStorage) =================
const LS_KEY="portalQuestoes_v1";
function salvarLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      questoes:state.questoes, turmas:state.turmas, testes:state.testes, respostas:state.respostas, idSeq
    }));
  }catch(e){ /* cota cheia ou navegador sem localStorage: segue sem persistir */ }
}
function carregarLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||!Array.isArray(d.questoes)) return false;
    state.questoes=d.questoes; state.turmas=d.turmas||[]; state.testes=d.testes||[]; state.respostas=d.respostas||[];
    const nums=[...state.questoes,...state.turmas,...state.testes,...state.respostas]
      .map(x=>parseInt(String(x&&x.id||"").replace(/\D/g,""),10)).filter(n=>!isNaN(n));
    idSeq=Math.max(idSeq, d.idSeq||0, ...(nums.length?nums:[0]));
    return true;
  }catch(e){ return false; }
}
function dadosJSON(){ return JSON.stringify({questoes:state.questoes, turmas:state.turmas, testes:state.testes, respostas:state.respostas, idSeq}, null, 2); }
function abrirBackup(){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal" style="max-width:560px">
    <h2 style="margin-top:0">Backup dos dados</h2>
    <p class="sub">O app guarda tudo automaticamente neste navegador. Para transferir ou ter segurança, exporte o arquivo abaixo — é por ele que subiremos o banco quando ligarmos o servidor.</p>
    <label>Exportar (copie ou baixe)</label>
    <textarea id="bkOut" readonly style="min-height:120px; font-family:ui-monospace,monospace; font-size:.78rem">${esc(dadosJSON())}</textarea>
    <div class="row" style="margin-top:8px">
      <button class="sec" onclick="copiarBackup()">Copiar</button>
      <button class="sec" onclick="baixarBackup()">Baixar arquivo .json</button>
    </div>
    <label style="margin-top:16px">Importar (cole um backup e substitua tudo)</label>
    <textarea id="bkIn" placeholder="Cole aqui o JSON de um backup" style="min-height:90px; font-family:ui-monospace,monospace; font-size:.78rem"></textarea>
    <div class="row" style="margin-top:8px">
      <input type="file" id="bkFile" accept="application/json,.json" style="width:auto" onchange="arquivoBackup(this)">
      <button class="acao" onclick="importarBackup()">Importar e substituir</button>
    </div>
    <div class="row" style="justify-content:space-between; margin-top:18px; border-top:1px solid var(--linha); padding-top:12px">
      <button class="linkbtn" onclick="resetarDados()">Apagar tudo e restaurar o exemplo</button>
      <button class="sec" data-fechar>Fechar</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector("[data-fechar]").onclick=()=>ov.remove();
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
}
function copiarBackup(){
  const t=document.getElementById("bkOut"); if(!t) return;
  t.select();
  try{ navigator.clipboard.writeText(t.value).then(()=>toast("Backup copiado."), ()=>{ document.execCommand("copy"); toast("Backup copiado."); }); }
  catch(e){ try{ document.execCommand("copy"); toast("Backup copiado."); }catch(_){ toast("Selecione o texto e copie manualmente."); } }
}
function baixarBackup(){
  try{
    const blob=new Blob([dadosJSON()], {type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`portal-questoes-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    toast("Arquivo gerado.");
  }catch(e){ toast("O navegador bloqueou o download aqui. Use 'Copiar' (funciona no site publicado)."); }
}
function arquivoBackup(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=e=>{ const ta=document.getElementById("bkIn"); if(ta) ta.value=e.target.result; toast("Arquivo carregado — confira e clique em Importar."); };
  r.readAsText(f);
}
function importarBackup(){
  const ta=document.getElementById("bkIn"); const txt=(ta&&ta.value||"").trim();
  if(!txt){ toast("Cole um backup ou escolha um arquivo primeiro."); return; }
  let d; try{ d=JSON.parse(txt); }catch(e){ toast("JSON inválido — confira o texto."); return; }
  if(!d||!Array.isArray(d.questoes)){ toast("Este backup não tem o formato esperado."); return; }
  confirmar("Importar vai substituir TODO o conteúdo atual (banco, provas e respostas). Continuar?", ()=>{
    state.questoes=d.questoes; state.turmas=d.turmas||[]; state.testes=d.testes||[]; state.respostas=d.respostas||[];
    const nums=[...state.questoes,...state.turmas,...state.testes,...state.respostas].map(x=>parseInt(String(x&&x.id||"").replace(/\D/g,""),10)).filter(n=>!isNaN(n));
    idSeq=Math.max(idSeq, d.idSeq||0, ...(nums.length?nums:[0]));
    salvarLocal();
    document.querySelectorAll(".overlay").forEach(o=>o.remove());
    provaSel = state.testes[0]? state.testes[0].id : null;
    setAba("banco"); toast("Backup importado.");
  });
}
function resetarDados(){
  confirmar("Apagar tudo o que está salvo neste navegador e voltar ao exemplo inicial? Não dá para desfazer.", ()=>{
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    location.reload();
  });
}

async function iniciar(){
  if(!CONECTADO){ seedDemo(); carregarLocal(); render(); return; }
  // modo conectado: parte vazio; o professor carrega os dados ao logar
  state.questoes=[]; state.turmas=[]; state.testes=[]; state.respostas=[];
  try{
    const {data}=await sb.auth.getSession();
    if(data && data.session){
      usuarioId=data.session.user.id; usuarioEmail=data.session.user.email; profLiberado=true;
      await carregarTudo();
    }
  }catch(e){ /* sem sessão: segue para a tela de login/entrada */ }
  render();
}
iniciar();
</script>
